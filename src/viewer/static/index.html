<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>toph replay viewer</title>
<style>
  * { box-sizing: border-box; }
  :root {
    --bg: #0c0e13; --panel: #141822; --panel2: #1a1f2b; --line: #262c39;
    --ink: #eef2fb; --dim: #93a0b8; --dim2: #64708a;
    --accent: #7ee0a2; --sel: #ffffff;
    --measured: #38bdf8; --current: #f59e0b; --proposed: #34d399; --threshold: #f87171; --historical: #64748b;
    --pass: #34d399; --fail: #f87171;
  }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink);
    font: 13px/1.45 ui-sans-serif, system-ui, "SF Pro Text", "Segoe UI", sans-serif; }
  #app { display: flex; flex-direction: column; height: 100vh; }

  header { display: flex; align-items: center; gap: 12px; padding: 7px 12px;
    background: var(--panel); border-bottom: 1px solid var(--line); flex: 0 0 auto; }
  header h1 { font-size: 13px; margin: 0; color: var(--accent); letter-spacing: .04em; font-weight: 700; }
  header .meta { color: var(--dim); font-size: 12px; }
  header .spacer { flex: 1 1 auto; }
  .toolbar { display: flex; align-items: center; gap: 6px; }
  .toolbar .zoomReadout { min-width: 46px; text-align: center; color: var(--dim); font-variant-numeric: tabular-nums; }

  button { background: var(--panel2); color: var(--ink); border: 1px solid var(--line);
    border-radius: 6px; padding: 5px 9px; cursor: pointer; font: inherit; font-size: 12px; }
  button:hover { background: #232a38; }
  button:disabled { opacity: .4; cursor: default; }
  button.primary { background: #1f6a3f; border-color: #2f9257; color: #eafff0; }
  button.primary:hover { background: #247a49; }
  button.toggle.on { background: #2b3b57; border-color: #3f6098; color: #dfeaff; }

  /* stage strip */
  #stagebar { flex: 0 0 auto; display: flex; align-items: stretch; gap: 6px; padding: 8px 12px;
    background: var(--panel); border-bottom: 1px solid var(--line); overflow-x: auto; }
  .stage { flex: 0 0 auto; display: flex; flex-direction: column; gap: 1px; min-width: 96px;
    padding: 6px 10px; background: var(--panel2); border: 1px solid var(--line); border-radius: 7px;
    cursor: pointer; }
  .stage:hover { background: #232a38; }
  .stage.active { background: #274063; border-color: #4d7fc4; }
  .stage.diverge { box-shadow: inset 0 0 0 1px var(--fail); }
  .stage .idx { font-size: 10px; color: var(--dim2); font-variant-numeric: tabular-nums; }
  .stage .nm { font-size: 12px; color: var(--ink); white-space: nowrap; }
  .stage.active .nm { color: #eaf2ff; font-weight: 600; }
  .stage .badge { font-size: 10px; color: var(--dim); }

  #main { display: flex; flex: 1 1 auto; min-height: 0; }
  #canvasWrap { flex: 1 1 auto; overflow: auto; background: #05070c; position: relative; cursor: grab; }
  #canvasWrap.panning { cursor: grabbing; user-select: none; }
  canvas#stage { display: block; background: #05070c; image-rendering: auto; }
  #canvasHint { position: absolute; left: 10px; bottom: 8px; color: var(--dim2); font-size: 11px;
    background: rgba(8,10,15,.7); padding: 3px 7px; border-radius: 5px; pointer-events: none; }
  #evHud { position: absolute; left: 12px; top: 12px; max-width: 380px; pointer-events: none;
    background: rgba(9,12,18,.92); border: 1px solid var(--line); border-left-width: 4px; border-radius: 9px;
    padding: 9px 12px; box-shadow: 0 8px 24px rgba(0,0,0,.45); }
  #evHud.hidden { display: none; }
  #evHud .h { font-size: 12px; color: var(--dim); }
  #evHud .x { margin-top: 3px; font-size: 20px; font-variant-numeric: tabular-nums;
    font-family: ui-monospace, "SF Mono", Menlo, monospace; color: #fff; }
  #evHud .x .op, #evHud .x .thr { color: var(--dim); font-weight: 400; }
  #evHud .d { display: inline-block; margin-top: 6px; padding: 1px 9px; border-radius: 10px;
    font-size: 12px; font-weight: 800; letter-spacing: .03em; }

  #rail { flex: 0 0 372px; display: flex; flex-direction: column; min-height: 0;
    border-left: 1px solid var(--line); background: var(--panel); }
  #rail .scroll { overflow-y: auto; padding: 0 0 8px 0; }
  section { border-bottom: 1px solid var(--line); padding: 10px 12px; }
  section h2 { font-size: 11px; text-transform: uppercase; letter-spacing: .06em; color: var(--dim);
    margin: 0 0 8px 0; display: flex; align-items: center; gap: 8px; }
  section h2 .sub { text-transform: none; letter-spacing: 0; color: var(--dim2); font-weight: 400; }

  .obsnav { display: flex; align-items: center; gap: 6px; margin-bottom: 8px; }
  .obsnav .count { color: var(--dim); font-size: 11px; margin-left: auto; }

  .ecard { border: 1px solid var(--line); border-left: 3px solid var(--historical);
    border-radius: 7px; padding: 8px 10px; margin-bottom: 7px; background: var(--panel2); cursor: pointer; }
  .ecard:hover { background: #212836; }
  .ecard.sel { background: #26324a; border-color: #4d7fc4; }
  .ecard.role-measured { border-left-color: var(--measured); }
  .ecard.role-current { border-left-color: var(--current); }
  .ecard.role-proposed { border-left-color: var(--proposed); }
  .ecard.role-threshold { border-left-color: var(--threshold); }
  .ecard .lab { font-size: 12px; color: var(--ink); font-weight: 600; }
  .ecard .expr { margin-top: 3px; font-size: 13px; font-variant-numeric: tabular-nums;
    font-family: ui-monospace, "SF Mono", Menlo, monospace; color: #dbe6fb; }
  .ecard .expr .val { color: #fff; font-weight: 700; }
  .ecard .expr .op { color: var(--dim); }
  .ecard .expr .thr { color: var(--dim); }
  .decision { display: inline-block; margin-top: 5px; padding: 1px 8px; border-radius: 10px;
    font-size: 11px; font-weight: 700; letter-spacing: .03em; }
  .decision.pass, .decision.SWAP, .decision.DETECTED { background: #17402c; color: var(--pass); }
  .decision.fail, .decision.REJECTED { background: #45211f; color: var(--fail); }
  .decision.KEEP, .decision.neutral { background: #2a3242; color: var(--dim); }

  .selid { font-size: 15px; font-weight: 700; margin-bottom: 2px; }
  .selkind { color: var(--dim); font-size: 12px; margin-bottom: 8px; }
  .kv { display: grid; grid-template-columns: auto 1fr; gap: 2px 10px; font-size: 12px; }
  .kv .k { color: var(--dim); }
  .kv .v { color: var(--ink); font-variant-numeric: tabular-nums; }
  .muted { color: var(--dim2); font-size: 12px; }
  .rawbox { margin-top: 8px; }
  .rawbox pre { white-space: pre-wrap; word-break: break-word; font-size: 11px; color: var(--dim);
    background: #0e1219; border: 1px solid var(--line); border-radius: 6px; padding: 6px; margin: 4px 0 0; }

  .legend { display: flex; flex-wrap: wrap; gap: 6px 12px; font-size: 11px; color: var(--dim); }
  .legend .li { display: flex; align-items: center; gap: 5px; }
  .legend .sw { width: 14px; height: 3px; border-radius: 2px; display: inline-block; }
  .legend .dot { width: 9px; height: 9px; border-radius: 50%; display: inline-block; }

  /* param drawer */
  #drawer { position: fixed; left: 0; right: 0; bottom: 0; background: var(--panel);
    border-top: 1px solid #33405c; box-shadow: 0 -12px 34px rgba(0,0,0,.5); padding: 12px 16px 16px;
    transform: translateY(105%); transition: transform .18s ease; z-index: 20; }
  #drawer.open { transform: translateY(0); }
  #drawer .hd { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
  #drawer .hd h2 { margin: 0; font-size: 12px; text-transform: uppercase; letter-spacing: .06em; color: var(--dim); }
  #drawer .hd .spacer { flex: 1 1 auto; }
  #paramGrid { display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 10px 22px; }
  .prow { display: flex; flex-direction: column; gap: 5px; padding: 8px 10px; border: 1px solid var(--line);
    border-radius: 8px; background: var(--panel2); }
  .prow.forstage { border-color: #3f6098; }
  .prow .plabel { font-size: 12px; color: var(--ink); display: flex; align-items: center; gap: 8px; }
  .prow .plabel .tag { font-size: 10px; color: #9cc0ff; border: 1px solid #33507e; border-radius: 8px; padding: 0 6px; }
  .prow .pctl { display: flex; align-items: center; gap: 12px; }
  .prow input[type=range] { flex: 1 1 auto; min-width: 180px; height: 22px; }
  .prow input[type=number] { width: 92px; background: #0e1219; border: 1px solid var(--line); color: var(--ink);
    font: inherit; font-size: 13px; padding: 4px 6px; border-radius: 6px; text-align: right;
    font-variant-numeric: tabular-nums; }
  .prow input[type=checkbox] { width: 18px; height: 18px; }
  #patchPreview { color: var(--dim); font-size: 12px; font-family: ui-monospace, monospace; }

  /* advanced region */
  #advanced { flex: 0 0 auto; border-top: 1px solid var(--line); background: var(--panel); max-height: 34vh;
    overflow: auto; }
  #advanced.hidden { display: none; }
  #advanced section { border-bottom: none; }
  table { border-collapse: collapse; width: 100%; font-size: 12px; }
  th, td { border: 1px solid var(--line); padding: 4px 7px; text-align: left; white-space: nowrap; }
  th { cursor: pointer; background: var(--panel2); position: sticky; top: 0; color: var(--dim); }
  tr.sel td { background: #22304a; }
  .a { color: var(--current); } .b { color: var(--measured); }
  #tree ul { list-style: none; margin: 0; padding-left: 14px; } #tree > ul { padding-left: 0; }
  .treenode { padding: 2px 5px; border-radius: 5px; cursor: pointer; }
  .treenode:hover { background: #1f2532; } .treenode.selected { background: #274063; }
  .treenode.pinnedA { outline: 1px solid var(--current); } .treenode.pinnedB { outline: 1px solid var(--measured); }
  .err { color: var(--fail); } .ok { color: var(--pass); }
  .kbd { color: var(--dim2); font-size: 11px; }
  .gridrow { display: flex; gap: 6px; align-items: center; margin-bottom: 5px; }
  select, input[type=text] { background: #0e1219; color: var(--ink); border: 1px solid var(--line);
    font: inherit; font-size: 12px; padding: 3px 6px; border-radius: 6px; }
</style>
</head>
<body>
<div id="app">
  <header>
    <h1>TOPH</h1>
    <span class="meta" id="pipelineMeta"></span>
    <span class="spacer"></span>
    <div class="toolbar">
      <button id="maskBtn" class="toggle" title="Cycle mask view (M): source / +mask / mask only / component">Mask: source</button>
      <button id="zoomOut" title="Zoom out (E)">&minus;</button>
      <span class="zoomReadout" id="zoomReadout">100%</span>
      <button id="zoomIn" title="Zoom in (Q)">+</button>
      <button id="zoomFit" title="Fit (F)">Fit</button>
      <button id="tuneBtn" class="toggle" title="Tune parameters &rarr; new run">Tune</button>
      <button id="advBtn" class="toggle" title="Runs, experiment tree, A/B">Advanced</button>
    </div>
  </header>

  <div id="stagebar"></div>

  <div id="main">
    <div id="canvasWrap">
      <canvas id="stage" width="800" height="600"></canvas>
      <div id="evHud" class="hidden"></div>
      <div id="canvasHint">drag to pan · scroll to zoom · click evidence or an entity</div>
    </div>
    <div id="rail">
      <div class="scroll">
        <section id="stageEvidenceSection">
          <h2>This stage <span class="sub" id="stageEvidenceName"></span></h2>
          <div class="obsnav">
            <button id="obsPrev" title="Previous observation (,)">&larr;</button>
            <button id="obsNext" title="Next observation (.)">&rarr;</button>
            <span class="count" id="obsCount"></span>
          </div>
          <div id="evidenceList"></div>
        </section>
        <section id="selectionSection">
          <h2>Selection</h2>
          <div id="selectionBody"><div class="muted">Click an entity or an evidence card to focus it on the image.</div></div>
        </section>
        <section id="legendSection">
          <h2>Legend</h2>
          <div class="legend" id="legend"></div>
        </section>
      </div>
    </div>
  </div>

  <div id="advanced" class="hidden">
    <section id="runsSection">
      <h2>Runs <span class="sub kbd">click to load · pin for A/B</span></h2>
      <div id="abControls" class="gridrow"></div>
      <div id="abStatus" class="muted"></div>
      <div id="diffBody"></div>
    </section>
    <section id="treeSection"><h2>Experiment tree</h2><div id="tree"></div></section>
    <section id="gridSection">
      <h2>Grid sweep</h2>
      <div id="gridForm"></div>
      <button id="gridBtn">run grid &rarr; children</button>
      <span class="muted" id="gridStatus"></span>
    </section>
    <section id="tableSection"><h2>Summary table</h2>
      <div style="overflow:auto"><table id="runsTable"><thead></thead><tbody></tbody></table></div>
    </section>
  </div>

  <div id="drawer">
    <div class="hd">
      <h2>Tune parameters</h2>
      <span class="muted" id="drawerStageNote"></span>
      <span class="spacer"></span>
      <span id="patchPreview">(no changes)</span>
      <button class="primary" id="applyBtn" disabled>apply &rarr; new run</button>
      <button id="drawerClose">close</button>
    </div>
    <div id="paramGrid"></div>
  </div>
</div>
<script src="/viewer.js"></script>
</body>
</html>
