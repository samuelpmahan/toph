name: ChainSpot validation

on:
  pull_request:
  workflow_dispatch:

jobs:
  browser-validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run chainspot:browser -- --ground-truth heritage-v1 --artifacts artifacts/browser
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: chainspot-browser-validation
          path: artifacts/browser

  cv-validation-self-hosted:
    runs-on: [self-hosted, linux, opencv]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run chainspot:cv -- --ground-truth heritage-v1 --artifacts artifacts/cv
      - run: npm test -- test/evaluation/compare.test.ts
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: chainspot-cv-validation
          path: artifacts/cv
